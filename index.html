<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼성 vs 애플 핸드폰 가격 비교</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>📱 삼성 vs 애플 핸드폰 가격 비교</h1>
  <p class="subtitle">최신 갤럭시 · 아이폰 라인업의 출고가를 한눈에 비교해보세요</p>
</header>

<main>
  <section class="controls" aria-label="필터 및 정렬">
    <div class="control-group brand-filter" role="group" aria-label="제조사 필터">
      <button class="chip active" data-brand="all">전체</button>
      <button class="chip" data-brand="samsung">삼성</button>
      <button class="chip" data-brand="apple">애플</button>
    </div>

    <div class="control-group">
      <input type="search" id="searchInput" placeholder="모델명 검색 (예: Ultra, Pro)" aria-label="모델 검색">
    </div>

    <div class="control-group">
      <label for="sortSelect" class="sr-only">정렬</label>
      <select id="sortSelect" aria-label="정렬 기준">
        <option value="price-asc">가격 낮은순</option>
        <option value="price-desc">가격 높은순</option>
        <option value="name-asc">이름순</option>
        <option value="year-desc">최신순</option>
      </select>
    </div>
  </section>

  <section id="compareBar" class="compare-bar" hidden>
    <div class="compare-bar-inner">
      <span class="compare-label">비교 선택됨:</span>
      <div id="compareChips" class="compare-chips"></div>
      <button id="clearCompare" class="link-btn">선택 해제</button>
      <button id="openCompare" class="btn-primary">비교하기</button>
    </div>
  </section>

  <section id="productGrid" class="product-grid" aria-live="polite"></section>

  <p id="emptyState" class="empty-state" hidden>검색 결과가 없습니다.</p>
</main>

<div id="compareModal" class="modal" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-label="가격 및 사양 비교">
    <button class="modal-close" id="closeModal" aria-label="닫기">✕</button>
    <h2>사양 비교</h2>
    <div id="compareTableWrap"></div>
  </div>
</div>

<footer class="site-footer">
  <p>⚠️ 표시된 가격은 국내 자급제 출고가 기준 참고용 데이터이며, 실제 판매가는 통신사·매장·프로모션에 따라 달라질 수 있습니다. 정확한 가격은 삼성전자·애플 공식 스토어에서 확인하세요.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
