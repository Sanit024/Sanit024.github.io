<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과학·기술 뉴스 헤드라인 & 탐구주제 추천</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>🔬 과학·기술 뉴스 헤드라인</h1>
  <p class="subtitle">물리·화학·지구과학·생명과학 및 AI·컴퓨터 분야 최신 뉴스와, 기사별 생기부 탐구주제 아이디어</p>
</header>

<main>
  <nav class="tabs" id="tabs" aria-label="분야 선택"></nav>

  <div class="toolbar">
    <span id="feedMeta" class="feed-meta"></span>
    <button id="refreshBtn" class="link-btn">🔄 새로고침</button>
  </div>

  <section id="newsList" class="news-list" aria-live="polite"></section>

  <div id="statusBox" class="status-box" hidden></div>
</main>

<footer class="site-footer">
  <p>📰 헤드라인·요약은 각 언론사(ScienceDaily)의 공개 RSS 피드에서 가져오며, 전체 기사는 원문 링크에서 확인할 수 있습니다.</p>
  <p>🎓 "생기부 탐구주제 추천"은 기사 제목·요약을 바탕으로 자동 생성된 참고용 아이디어입니다. 실제 학교생활기록부에는 본인이 직접 수행한 탐구 과정과 결과를 구체적으로 작성해야 하며, 활용 전 반드시 담당 선생님과 상담하세요.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
